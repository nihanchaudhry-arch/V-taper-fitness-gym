<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#1f43c9"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style></head><body>
<title>V-Taper Coach</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
/* Layout: single gym-floor column (max 600px), sticky header, fixed bottom tab bar, one-thumb controls. Palette borrows a 20 kg plate blue. */
:root {
  --bg: #eef0f4; --surface: #ffffff; --surface-2: #e4e8ef; --ink: #121827; --muted: #586176; --line: #d3d8e2;

  --good: #1b7f47; --good-soft: #dff3e7; --warn: #9a6408; --warn-soft: #fbf0d9; --bad: #b42323; --bad-soft: #fbe3e3;
  --c-free: #7a3fb0; --c-machine: #1f43c9; --c-cable: #0f7d80; --c-bw: #a24d14; --c-band: #6b7a10; --c-cardio: #b42358;
  --display: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", system-ui, sans-serif;
  --body: "Barlow", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --r: 14px; --nav-h: 64px; --hl: #ff3d1f; --mach: #b9c1cf; --skin: #e2ad86; --skin2: #c08a66; --shirt: #33415c; --shorts: #1c2230; --shorts2: #2c3445; --shoe: #f2f2f2; --hair: #2a1c12;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0c1019; --surface: #151b28; --surface-2: #1d2535; --ink: #e9edf5; --muted: #9aa4b9; --line: #2a3346;
  --accent: #7d97ff; --accent-ink: #0b1020; --accent-soft: #1f2a4d;
  --good: #4cc68a; --good-soft: #143424; --warn: #e6b24f; --warn-soft: #3a2c10; --bad: #ff7a7a; --bad-soft: #3d1717;
  --c-free: #c28cf0; --c-machine: #8ea5ff; --c-cable: #4fd1d4; --c-bw: #f19a5c; --c-band: #c5d45a; --c-cardio: #ff7aa8; --hl: #ff5a3a; --mach: #3d4862; --skin: #e2ad86; --skin2: #b07a58; --shirt: #5d7096; --shorts: #0e121b; --shorts2: #232a3a; --shoe: #d9dde5; --hair: #120c08; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0c1019; --surface: #151b28; --surface-2: #1d2535; --ink: #e9edf5; --muted: #9aa4b9; --line: #2a3346;
  --accent: #7d97ff; --accent-ink: #0b1020; --accent-soft: #1f2a4d;
  --good: #4cc68a; --good-soft: #143424; --warn: #e6b24f; --warn-soft: #3a2c10; --bad: #ff7a7a; --bad-soft: #3d1717;
  --c-free: #c28cf0; --c-machine: #8ea5ff; --c-cable: #4fd1d4; --c-bw: #f19a5c; --c-band: #c5d45a; --c-cardio: #ff7aa8; --hl: #ff5a3a; --mach: #3d4862; --skin: #e2ad86; --skin2: #b07a58; --shirt: #5d7096; --shorts: #0e121b; --shorts2: #232a3a; --shoe: #d9dde5; --hair: #120c08; color-scheme: dark }
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font: 400 16px/1.45 var(--body); -webkit-text-size-adjust: 100%; }
body.locked { overflow: hidden; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--surface); }
h1, h2, h3, h4 { font-family: var(--display); font-weight: 700; letter-spacing: .01em; line-height: 1.1; margin: 0 0 .4em; text-wrap: balance; }
h1 { font-size: 1.9rem; } h2 { font-size: 1.35rem; } h3 { font-size: 1.15rem; } h4 { font-size: 1rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin-top: 1em; }
p { margin: .35em 0; } ul, ol { padding-left: 1.2em; margin: .3em 0; }
a { color: var(--accent); }
.wrap, .top-in, .nav, .tm-in { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.wrap { max-width: 600px; margin: 0 auto; padding-block: 12px calc(var(--nav-h) + 90px); display: flex; flex-direction: column; gap: 12px; }
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--surface); border-bottom: 1px solid var(--line); }
.top-in { max-width: 600px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; height: 48px; }
.brand { font: 600 1.25rem var(--display); letter-spacing: .04em; text-transform: uppercase; } .brand b { color: var(--accent); }
.sync { font-size: .75rem; padding: 3px 9px; border-radius: 99px; background: var(--surface-2); color: var(--muted); }
.sync.ok { color: var(--good); background: var(--good-soft); } .sync.warn { color: var(--warn); background: var(--warn-soft); } .sync.err { color: var(--bad); background: var(--bad-soft); }
.nav { position: fixed; inset: auto 0 0 0; z-index: 25; background: var(--surface); border-top: 1px solid var(--line); display: flex; justify-content: center; padding-bottom: env(safe-area-inset-bottom, 0px); }
.nav a { flex: 1; max-width: 120px; height: var(--nav-h); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; color: var(--muted); text-decoration: none; font-size: .72rem; font-weight: 600; letter-spacing: .02em; }
.nav a.on { color: var(--accent); } .nav a.on svg { transform: translateY(-1px); }
.card, .hero { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; min-width: 0; }
.hero { border: 0; background: linear-gradient(160deg, var(--accent) 0%, color-mix(in srgb, var(--accent) 70%, var(--ink)) 100%); color: var(--accent-ink); }

.hero .exlist small { color: inherit; opacity: .78; }
.hero .btn.primary { background: var(--accent-ink); color: var(--accent); }
.hero .btn.ghost { border-color: color-mix(in srgb, var(--accent-ink) 50%, transparent); color: inherit; }
.hero .note { background: color-mix(in srgb, var(--accent-ink) 16%, transparent); color: inherit; border: 0; }
.eyebrow { font-size: .74rem; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.card-h { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; margin-bottom: 8px; flex-wrap: wrap; } .card-h h2, .card-h h3 { margin: 0; }
.link { font-weight: 600; font-size: .9rem; text-decoration: none; }
.pg { font-size: 2rem; text-transform: uppercase; margin-top: 4px; }

.row { display: flex; align-items: center; } .gap { gap: 8px; } .gap-s { gap: 6px; } .between { justify-content: space-between; } .grow { flex: 1; min-width: 0; } .wrap-r { flex-wrap: wrap; }
.nums, .big-num, .set input, .tm-n { font-variant-numeric: tabular-nums; }
.btn { font: 600 .95rem var(--body); border: 1px solid transparent; border-radius: 10px; padding: 10px 16px; cursor: pointer; background: var(--surface-2); color: var(--ink); text-decoration: none; display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 44px; white-space: nowrap; }
.btn.primary { background: var(--accent); color: var(--accent-ink); } .btn.good { background: var(--good); color: #fff; } .btn.danger { background: var(--bad); color: #fff; }
.btn.ghost { background: transparent; border-color: var(--line); } .btn.danger-t { color: var(--bad); }
.btn.big { min-height: 54px; font-size: 1.1rem; padding: 12px 22px; width: 100%; font-family: var(--display); letter-spacing: .05em; text-transform: uppercase; }
.btn.small { min-height: 38px; padding: 7px 12px; font-size: .88rem; } .btn.tiny { min-height: 32px; padding: 4px 10px; font-size: .82rem; border-radius: 8px; }
.btn:disabled { opacity: .4; cursor: default; }
.btn:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible, a:focus-visible, textarea:focus-visible { outline: 3px solid color-mix(in srgb, var(--accent) 55%, transparent); outline-offset: 2px; }
.linkbtn { background: none; border: 0; color: var(--accent); font: inherit; padding: 0; cursor: pointer; text-decoration: underline; }
.pill { display: inline-flex; align-items: center; font-size: .76rem; font-weight: 600; padding: 3px 9px; border-radius: 99px; background: var(--surface-2); color: var(--ink); white-space: nowrap; }
.pill.soft { background: var(--accent-soft); color: var(--accent); } .pill.good { background: var(--good-soft); color: var(--good); } .pill.bad { background: var(--bad-soft); color: var(--bad); }
.btnpill { border: 0; cursor: pointer; font-family: var(--body); min-height: 30px; }
.eq-free { color: var(--c-free); background: color-mix(in srgb, var(--c-free) 13%, transparent); } .eq-machine { color: var(--c-machine); background: color-mix(in srgb, var(--c-machine) 13%, transparent); }
.eq-cable { color: var(--c-cable); background: color-mix(in srgb, var(--c-cable) 13%, transparent); } .eq-bodyweight { color: var(--c-bw); background: color-mix(in srgb, var(--c-bw) 13%, transparent); }
.eq-band { color: var(--c-band); background: color-mix(in srgb, var(--c-band) 15%, transparent); } .eq-cardio { color: var(--c-cardio); background: color-mix(in srgb, var(--c-cardio) 13%, transparent); }
.hero .pill[class*="eq-"] { color: inherit; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0; }
.exlist { list-style: none; padding: 0; margin: 12px 0; display: grid; gap: 2px; counter-reset: ex; }
.exlist li { display: flex; flex-direction: column; padding: 8px 0 8px 34px; position: relative; border-top: 1px solid color-mix(in srgb, currentColor 18%, transparent); counter-increment: ex; }
.exlist li::before { content: counter(ex); position: absolute; left: 0; top: 8px; font: 700 1.3rem var(--display); opacity: .7; }
.exlist li span { font-weight: 600; } .exlist small { color: var(--muted); }
.note { padding: 10px 12px; border-radius: 10px; background: var(--surface-2); font-size: .92rem; margin: 8px 0; }
.note.good { background: var(--good-soft); color: var(--good); } .note.warn { background: var(--warn-soft); color: var(--warn); } .note.bad { background: var(--bad-soft); color: var(--bad); }
.warn-t { color: var(--warn); font-size: .9rem; }
.err { color: var(--bad); font-size: .9rem; min-height: 1.2em; }
.empty { padding: 20px; text-align: center; color: var(--muted); border: 1px dashed var(--line); border-radius: var(--r); }
.bar { height: 8px; border-radius: 99px; background: var(--surface-2); overflow: hidden; margin: 6px 0 2px; } .bar i { display: block; height: 100%; background: var(--accent); border-radius: inherit; }
.bar.prot i { background: var(--good); } .bar.over i { background: var(--bad); } .bar.goodb i { background: var(--good); }
.big-num { font: 700 1.8rem/1 var(--display); } .big-num small { font: 500 .85rem var(--body); color: var(--muted); } .big-num.sm { font-size: 1.4rem; }
.macro-main { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.kv3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--line); }
.kv3 div { display: flex; flex-direction: column; } .kv3 b { font: 700 1.2rem var(--display); } .kv3 span { font-size: .78rem; color: var(--muted); }
.kv2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.kv { display: flex; flex-direction: column; min-width: 0; } .kv span { font-size: .78rem; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; } .kv b { font: 700 1.45rem var(--display); } .kv small { font-size: .8rem; color: var(--muted); }
.tr { font-weight: 600; } .tr.up { color: var(--good); } .tr.dn { color: var(--bad); }
.tasks { list-style: none; padding: 0; margin: 0; }
.task { display: flex; align-items: center; gap: 12px; padding: 9px 0; border-top: 1px solid var(--line); } .task:first-child { border-top: 0; }
.task small { display: block; } .task.is-done .grow > div { text-decoration: line-through; color: var(--muted); } .task.is-skip .grow > div { color: var(--muted); }
.check { width: 32px; height: 32px; flex: none; border-radius: 9px; border: 2px solid var(--line); background: transparent; color: var(--accent-ink); font-weight: 700; cursor: pointer; }
.task.is-done .check { background: var(--good); border-color: var(--good); color: #fff; }
.task-reason { list-style: none; display: flex; gap: 8px; padding-bottom: 8px; } .task-reason input { flex: 1; }
input, select, textarea { font: 16px var(--body); color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; min-height: 44px; width: 100%; min-width: 0; }
textarea { resize: vertical; }
.field { display: flex; flex-direction: column; gap: 4px; margin: 8px 0; min-width: 0; } .field label { font-size: .82rem; font-weight: 600; color: var(--muted); }
.field.row { flex-direction: row; align-items: center; } .field.row select { width: auto; max-width: 62%; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 12px; }
.seg { display: inline-flex; background: var(--surface-2); border-radius: 10px; padding: 3px; gap: 3px; }
.seg button { border: 0; background: transparent; color: var(--ink); font: 600 .95rem var(--body); min-width: 44px; min-height: 38px; border-radius: 8px; cursor: pointer; }
.seg button.on { background: var(--accent); color: var(--accent-ink); }
.tog { display: flex; align-items: center; gap: 10px; padding: 8px 0; cursor: pointer; } .tog input { width: 22px; height: 22px; min-height: 0; flex: none; accent-color: var(--accent); }
/* workout */
.wk-head { display: flex; flex-direction: column; gap: 8px; }
.dots { display: flex; gap: 8px; }
.dot { flex: 1; height: 40px; border-radius: 10px; border: 2px solid var(--line); background: var(--surface); color: var(--ink); font: 700 1.1rem var(--display); cursor: pointer; }
.dot.pt { border-color: var(--accent); } .dot.dn { background: var(--good); border-color: var(--good); color: #fff; } .dot.sk { opacity: .45; text-decoration: line-through; } .dot.cur { outline: 3px solid color-mix(in srgb, var(--accent) 45%, transparent); outline-offset: 1px; }
.ex-card h1 { font-size: 2rem; text-transform: uppercase; }
.musc { display: grid; gap: 4px; margin: 8px 0; font-size: .95rem; } .musc span { display: inline-block; min-width: 82px; font-size: .74rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 600; }
.target { display: flex; flex-direction: column; padding: 10px 12px; border-radius: 10px; background: var(--accent-soft); margin: 8px 0; } .target b { font: 700 1.35rem var(--display); color: var(--accent); } .target span { font-size: .85rem; color: var(--muted); }
.how { border: 1px solid var(--line); border-radius: 10px; padding: 0 12px; margin: 8px 0; } .how summary { cursor: pointer; font-weight: 600; padding: 12px 0; min-height: 44px; }
.sug { border-radius: 10px; padding: 10px 12px; margin: 8px 0; background: var(--surface-2); } .sug.up { background: var(--good-soft); } .sug-h { font-size: .74rem; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
.sug.up .sug-h { color: var(--good); }
.prev { font-size: .9rem; margin: 6px 0; } .prev span { font-size: .74rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 600; margin-right: 8px; }
.sets { display: grid; gap: 6px; margin: 10px 0; }
.set { display: grid; grid-template-columns: 26px minmax(0, 1fr) 72px 60px 52px 66px; gap: 6px; align-items: center; }
.set.now { grid-template-columns: 26px minmax(0, 1fr) 80px 52px 66px; }
.set.hdr { font-size: .7rem; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
.set .n { font: 700 1.2rem var(--display); text-align: center; } .set .pv { font-size: .78rem; color: var(--muted); overflow-wrap: anywhere; }
.set input { text-align: center; padding: 8px 4px; font-weight: 600; font-size: 1.05rem; }
.set select { padding: 8px 2px; text-align: center; }
.setbtn { min-height: 44px; border-radius: 10px; border: 2px solid var(--accent); background: transparent; color: var(--accent); font: 700 .9rem var(--body); cursor: pointer; }
.set.done .setbtn { background: var(--good); border-color: var(--good); color: #fff; font-size: 1.2rem; } .set.done input, .set.done select { background: var(--good-soft); border-color: transparent; }
.wk-nav { display: grid; grid-template-columns: 1fr 2fr; gap: 8px; } .wk-nav .btn { min-height: 54px; font-size: 1.05rem; }
.timer { position: fixed; z-index: 26; left: 0; right: 0; bottom: calc(var(--nav-h) + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--bg); }
.tm-in { max-width: 600px; margin: 0 auto; display: grid; grid-template-columns: 1fr auto auto auto; align-items: center; gap: 8px; padding-block: 10px; position: relative; }
.tm-bar { position: absolute; left: 0; right: 0; top: 0; height: 3px; } .tm-bar i { display: block; height: 100%; background: var(--accent); transition: width .25s linear; }
.tm-l { font-weight: 600; } .tm-n { font: 700 1.7rem var(--display); }
.timer .btn.ghost { color: var(--bg); border-color: color-mix(in srgb, var(--bg) 40%, transparent); }
.prog-day { border-top: 1px solid var(--line); padding: 10px 0; } .pd-h { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.prog-day ul, .sumlist, .items, .foods, .menu, .exlib, .altlist { list-style: none; padding: 0; margin: 6px 0; }
.prog-day li, .sumlist li { display: flex; flex-direction: column; padding: 4px 0; } .prog-day small, .sumlist span { color: var(--muted); font-size: .85rem; }
/* nutrition */
.sticky-sum { position: sticky; top: calc(48px + env(safe-area-inset-top, 0px)); z-index: 5; }
.macros4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin: 8px 0 4px; }
.mc { display: flex; flex-direction: column; min-width: 0; } .mc span { font-size: .72rem; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); font-weight: 600; } .mc b { font: 700 1.4rem/1.1 var(--display); } .mc small { font-size: .74rem; color: var(--muted); }
.tabs { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; background: var(--surface-2); padding: 4px; border-radius: 12px; }
.tabs button { flex: 1 0 auto; border: 0; background: transparent; color: var(--muted); font: 600 .9rem var(--body); padding: 8px 12px; border-radius: 9px; cursor: pointer; min-height: 40px; }
.tabs button[aria-selected="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgb(0 0 0 / .08); }
.meal .mt { text-align: right; font-size: .85rem; color: var(--muted); } .meal .mt b { font: 700 1.15rem var(--display); color: var(--ink); }
.items li { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; padding: 6px 0; border-top: 1px solid var(--line); } .items li:first-child { border-top: 0; } .items li > span:first-child { min-width: 0; }
.items small.nums { color: var(--muted); white-space: nowrap; }
.x { border: 0; background: transparent; color: var(--muted); font-size: 1.3rem; width: 36px; height: 36px; border-radius: 8px; cursor: pointer; flex: none; } .x:hover { background: var(--surface-2); color: var(--bad); }
.cat { margin-top: 14px; font-size: 1rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }

.exlib li { border-top: 1px solid var(--line); } .exlib button { justify-content: space-between; } .exlib b, .exlib small { display: block; } .exlib small { color: var(--muted); font-size: .85rem; }
.filters { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; } .filters input { grid-column: 1 / -1; }

.chart { width: 100%; height: auto; display: block; margin-top: 4px; }

// ===== Line chart (SVG) =====
function lineChart(series, o = {}) {
  const W = 340, H = o.h || 170, L = o.mini ? 6 : 38, R = 8, T = 10, B = o.mini ? 8 : 22;
  const all = series.flatMap(s => s.pts.filter(p => p[1] != null));
  const xs = all.map(p => parseYmd(p[0]).getTime()); const ys = all.map(p => p[1]);
  let x0 = Math.min(...xs), x1 = Math.max(...xs); if (x1 === x0) x1 = x0 + 86400000;
  let y0 = Math.min(...ys), y1 = Math.max(...ys); const pad = Math.max((y1 - y0) * 0.15, 0.5); y0 -= pad; y1 += pad;
  const step = niceStep((y1 - y0) / 4); y0 = Math.floor(y0 / step) * step; y1 = Math.ceil(y1 / step) * step;
  const X = t => L + (t - x0) / (x1 - x0) * (W - L - R), Y = v => T + (1 - (v - y0) / (y1 - y0)) * (H - T - B);
  let g = '';
  if (!o.mini) {
    for (let v = y0; v <= y1 + 1e-9; v += step) g += '<line class="grid" x1="' + L + '" x2="' + (W - R) + '" y1="' + Y(v) + '" y2="' + Y(v) + '"/><text class="ax" x="' + (L - 6) + '" y="' + (Y(v) + 3.5) + '" text-anchor="end">' + (+v.toFixed(1)) + '</text>';
    g += '<text class="ax" x="' + L + '" y="' + (H - 6) + '">' + fmtShort(ymd(new Date(x0))) + '</text><text class="ax" x="' + (W - R) + '" y="' + (H - 6) + '" text-anchor="end">' + fmtShort(ymd(new Date(x1))) + '</text>';
  }
  for (const s of series) {
    const pts = s.pts.filter(p => p[1] != null).map(p => [X(parseYmd(p[0]).getTime()), Y(p[1])]);
    if (s.line !== false && pts.length > 1) g += '<polyline class="ln ' + s.cls + '" points="' + pts.map(p => p[0].toFixed(1) + ',' + p[1].toFixed(1)).join(' ') + '"/>';

  if (t.dataset.prog) {
    const [dk, slot, key] = t.dataset.prog.split(':'); p.program = p.program || {}; p.program[dk] = p.program[dk] || {}; const o = p.program[dk][slot] = p.program[dk][slot] || {};
    if (key === 'main') o.main = t.value; else { const v = num(t.value); const lim = { sets: [1, 6], lo: [1, 120], hi: [1, 120], rest: [30, 300] }[key]; if (v == null || v < lim[0] || v > lim[1]) { toast('Enter ' + lim[0] + '–' + lim[1]); return; } o[key] = Math.round(v); if (o.lo && o.hi && o.lo > o.hi) { toast('Low must be ≤ high'); delete o[key]; } }
    saveProfile(p); toast('Program updated'); return;
  }
  if (t.dataset.pref) { p[t.dataset.pref] = t.checked; saveProfile(p); return; }
  if (t.dataset.rec) { const d = day(today()); d.rec = d.rec || {}; const v = num(t.value); if (v != null && (v < 0 || (t.dataset.rec === 'sleep' && v > 24) || v > 100000)) { toast('Check that value'); return; } d.rec[t.dataset.rec] = v; saveDay(d); rerenderKeepScroll(); return; }
  if (t.dataset.fooddate) { if (t.value && t.value <= today()) { ui.foodDate = t.value; render(); } return; }
  if (t.dataset.filter) { ui[t.dataset.filter] = t.value; render(); return; }
  if (t.dataset.progex) { ui.progEx = t.value; rerenderKeepScroll(); return; }
  if (t.dataset.photo) return addPhoto(t);
  if (t.dataset.scalepdf) return readScalePdf(t);
  if (t.dataset.import) return importBackup(t);
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.dataset.q) { ui.q = t.value; render(); return; }
  if (t.dataset.afq) { ui.sheet.q = t.value; const l = $('#afList'); if (l) l.innerHTML = afList(t.value); return; }
  if (t.dataset.afg) { const g = num(t.value) || 0; ui.sheet.g = g; const n = nut({ f: ui.sheet.food, g }); const o = $('#afNut'); if (o) o.innerHTML = r0(n.k) + ' kcal · ' + r1(n.p) + ' g protein · ' + r1(n.c) + ' g carbs · ' + r1(n.f) + ' g fat<br><small class="muted">' + esc(microLine(n)) + '</small>'; return; }
  if (t.dataset.set) { const s = curSess(); if (s) { readSetRow(s, s.idx, Number(t.dataset.j)); clearTimeout(A._st); A._st = setTimeout(() => saveSession(s), 500); } }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && ui.sheet) closeSheet(); });
window.addEventListener('hashchange', () => { ui.q = ''; ui.confirm = null; closeSheet(); render(); window.scrollTo(0, 0); if (route() === 'session' && activeSession()) keepAwake(true); });
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && route() === 'session' && activeSession()) keepAwake(true); });

async function addPhoto(input) {
  const f = input.files && input.files[0]; const msg = $('#photoMsg'); if (!f) return;
  if (!/^image\//.test(f.type)) { msg.textContent = 'Choose an image file.'; return; }
  msg.textContent = 'Processing…';
  try {
    const url = await new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsDataURL(f); });
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = url; });
    const max = 720; const sc = Math.min(1, max / Math.max(img.width, img.height)); const c = document.createElement('canvas'); c.width = Math.round(img.width * sc); c.height = Math.round(img.height * sc);
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); let q = 0.8, data = c.toDataURL('image/jpeg', q); while (data.length > 200000 && q > 0.4) { q -= 0.1; data = c.toDataURL('image/jpeg', q); }
    const id = uid(); Store.put('photo_' + id, { id, data }); const ph = Store.get('photos') || { list: [] }; ph.list.push({ id, date: today() }); Store.put('photos', ph);
    msg.textContent = 'Photo saved privately.'; rerenderKeepScroll();
  } catch (e) { msg.textContent = 'Could not read that image. Try a JPEG or PNG.'; }
}
async function importBackup(input) {
  const f = input.files && input.files[0]; const msg = $('#dataMsg'); if (!f) return;
  try { const j = JSON.parse(await f.text()); if (!j || j.app !== 'vtaper' || typeof j.docs !== 'object') throw new Error('not a V-Taper backup');
    let n = 0; for (const [k, v] of Object.entries(j.docs)) { if (!/^[A-Za-z0-9_.:@+~-]+$/.test(k) || typeof v !== 'object') continue; Store.put(k, v); n++; }
    ensureDefaults(); render(); toast('Restored ' + n + ' records from your backup'); const m2 = $('#dataMsg'); if (m2) m2.textContent = 'Restored ' + n + ' records.';
  } catch (e) { msg.textContent = 'Could not restore: ' + e.message + '.'; }
}

async function readScalePdf(input) {
  const f = input.files && input.files[0]; const msg = $('#scaleMsg'); if (!f) return;
  msg.textContent = 'Reading the report…';
  try {
    const txt = await pdfText(f); const r = parseScaleText(txt);
    const n = Object.keys(r.v).length; if (!n) throw new Error('No smart-scale values found in this PDF');
    ui.scaleDraft = { date: r.date || today(), v: r.v }; rerenderKeepScroll();
    const m = $('#scaleMsg'); if (m) m.textContent = 'Found ' + n + ' values' + (r.date ? ' from ' + fmtShort(r.date) : '') + '. Check them, then tap Save report.';
  } catch (e) { msg.textContent = 'Couldn’t read that PDF (' + e.message + '). Enter the values by hand instead.'; }
}

// ===== Boot =====
(async function boot() {
  document.getElementById('app').innerHTML = shell();
  await Store.loadLocal();
  if (Store.get('profile')) { ensureDefaults(); render(); }
  else $('#view').innerHTML = '<div class="empty">Loading your plan…</div>';
  setSync();
  Store.connect().then(() => { ensureDefaults(); render(); if (route() === 'session' && activeSession()) keepAwake(true); });
})();
